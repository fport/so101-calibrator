name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reused by the release workflow

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra ai
      - run: uv run ruff check .
      - run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run the mock end to end
        env:
          SO101CAL_HOME: ${{ runner.temp }}/store
          HF_LEROBOT_CALIBRATION: ${{ runner.temp }}/lerobot
        run: |
          uv venv --python 3.12 ${{ runner.temp }}/venv
          source ${{ runner.temp }}/venv/bin/activate
          uv pip install dist/*.whl
          cd ${{ runner.temp }}
          so101-cal --version
          so101-cal --mock --mock-speed 4 calibrate leader --yes
          so101-cal --mock --mock-speed 4 calibrate follower --yes
          so101-cal --mock verify follower --yes
          so101-cal --mock teleop-test --seconds 3 --yes
          python -m so101_calibrator history
          python -c "from so101_calibrator import assets; assert len(assets.frames('ranges', 'l')[0]) > 10"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
