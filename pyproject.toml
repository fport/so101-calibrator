[project]
name = "so101-calibrator"
dynamic = ["version"]
description = "Checked, versioned calibration for SO-101 robot arms (LeRobot compatible), with a simple terminal UI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fport" }]
keywords = ["robotics", "so-101", "so-arm100", "lerobot", "feetech", "sts3215", "calibration", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "feetech-servo-sdk>=1.0.0",  # STS3215 motors (the SDK LeRobot uses)
    "pillow>=10.0",  # decodes the SO-101 animations
    "pyserial>=3.5",  # serial port discovery
    "rich>=13.0",
    "textual>=8.2,<9",  # the terminal UI; its API changes between majors
]

[project.optional-dependencies]
ai = [  # the optional assistant: a Strands agent; anthropic is what Strands' Claude model talks through
    "anthropic>=2.3.0",
    "strands-agents[ollama,openai]>=1.0",
]

[project.scripts]
so101-cal = "so101_calibrator.cli:main"

[project.urls]
Homepage = "https://github.com/fport/so101-calibrator"
Documentation = "https://github.com/fport/so101-calibrator#readme"
Changelog = "https://github.com/fport/so101-calibrator/blob/main/CHANGELOG.md"
Issues = "https://github.com/fport/so101-calibrator/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/so101_calibrator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_calibrator"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
