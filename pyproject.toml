[project]
name = "so101-calibrator"
version = "0.1.0"
description = "Step-by-step, checked and versioned calibration for SO-101 leader/follower arms (LeRobot compatible), with a terminal UI, an optional AI helper (local or API), a CLI and a local web dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "so101-calibrator contributors" }]
keywords = ["robotics", "so-101", "so-arm100", "lerobot", "feetech", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
# The core (wizard, checks, store, dashboard, mock bus) is pure standard library.
dependencies = [
    "textual>=8.2.8",
]

[project.optional-dependencies]
# Needed only to talk to real Feetech STS3215 motors.
hardware = [
    "feetech-servo-sdk>=1.0.0",
    "pyserial>=3.5",
]
ai = [
    "anthropic>=2.3.0",
]

[project.scripts]
so101-cal = "so101_calibrator.cli:main"

[project.urls]
Homepage = "https://github.com/fport/so101-calibrator"
Issues = "https://github.com/fport/so101-calibrator/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_calibrator"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
